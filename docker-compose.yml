services:
  mongo:
    image: mongo:8.0
    container_name: mono-chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: mono-chat-app
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/mono_chat
      JWT_SECRET: change-this-to-a-long-random-secret
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mongo_data:
